# nginx alternative to deploy/Caddyfile, for a host that already runs nginx.
# Replace api.example.com with your base domain (3 hosts: id., link., share.).
# Certificates: one Let's Encrypt cert for all three names, see README.
# The api container must be published on 127.0.0.1:5101 (docker-compose.yml does that).

upstream mailspring_api {
    server 127.0.0.1:5101;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name id.api.example.com link.api.example.com share.api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Identity + metadata sync (client rootURLForServer('identity'), sync engine IDENTITY_SERVER).
# Shared pages/assets and tracking URLs are not served here: /page and /asset hold
# user-supplied HTML/files and must not share an origin with the session cookie and API.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name id.api.example.com;

    ssl_certificate     /etc/letsencrypt/live/id.api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.api.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # attachments for thread sharing go through /api/save-public-asset
    client_max_body_size 50m;

    location ~ ^/(page|asset|thread|o|open|link)/ {
        return 404;
    }

    # long-lived newline-delimited stream, heartbeat every 10s, server closes after 15min
    location /deltas/ {
        proxy_pass http://mailspring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://mailspring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Open/link tracking (open-tracking and link-tracking package.json serverUrl). Public.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name link.api.example.com;

    ssl_certificate     /etc/letsencrypt/live/id.api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.api.example.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(o|open|link)/ {
        proxy_pass http://mailspring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 404;
    }
}

# Shared threads, activity report pages, uploaded assets, signature icons (SHARE_URL). Public.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name share.api.example.com;

    ssl_certificate     /etc/letsencrypt/live/id.api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.api.example.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(page|asset|thread|signature-assets)/ {
        proxy_pass http://mailspring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://mailspring_api;
    }
    location / {
        return 404;
    }
}
