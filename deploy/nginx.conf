# nginx site for mailspring-api on a single host. Replace link.api.example.com with your
# host, enable it, then run `certbot --nginx -d <host>`: certbot adds the 443/SSL lines
# and the HTTP->HTTPS redirect to this server block.
# The api container must listen on 127.0.0.1:5101 (see README).

upstream mailspring_api {
    server 127.0.0.1:5101;
    keepalive 8;
}

server {
    listen 80;
    server_name link.api.example.com;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 20m;

    # Thread sharing / shared activity pages are not used. They would serve third-party
    # HTML (shared mail bodies) on the same origin as the API and the session cookie.
    location ~ ^/(thread|page)/ {
        return 404;
    }

    # long-lived newline-delimited stream, heartbeat every 10s, server closes after 15min
    location /deltas/ {
        proxy_pass http://mailspring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://mailspring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
