# Optional: same as the `docker run` command in README.
services:
  api:
    image: mailspring-api:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5101:5101"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-UTC}
      - SHARE_URL=${PUBLIC_URL:?set PUBLIC_URL in .env}
